name: Install the apt packages
description: >-
  SDL2 and ffmpeg for the desktop build, from a cache of the installed files.
  Every job installs the same list, so all of them share one cache entry.

runs:
  using: composite
  steps:
    # The key names the runner image release (ImageVersion up to its first
    # dot, a date) and this file, which holds the package list. A cache
    # from an older image could overwrite newer libraries that the new
    # image ships. The rest of ImageVersion differs between runners of one
    # release, so it stays out of the key. Asking apt for the package
    # versions took about 9 s per job, so the key doesn't name them: a new
    # image release refreshes the cache.
    - name: Name the cache
      shell: bash
      env:
        LIST: ${{ hashFiles('.github/actions/apt-packages/action.yml') }}
      run: |
        {
          echo "APT_CACHE_KEY=apt-${ImageOS:-unknown}-${ImageVersion%%.*}-$LIST"
          echo "APT_CACHE_DIR=$RUNNER_TEMP/apt-cache"
        } >> "$GITHUB_ENV"
    - name: Restore the installed files
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.APT_CACHE_DIR }}
        key: ${{ env.APT_CACHE_KEY }}
    # A hit unpacks one archive of every file the install added or
    # changed, and skips apt and dpkg. It runs no package scripts.
    - name: Unpack the installed files
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: sudo tar -xf "$APT_CACHE_DIR/files.tar" -C /
    # A miss installs without recommended packages. The archive holds the
    # files of every package the install added or changed (one that only
    # gets a new version must be restored too), and every file the package
    # scripts wrote, such as the links update-alternatives makes. Those
    # links carry the package's old times, so the search goes by the
    # change time (ctime), which no script can set back. /usr/local holds
    # the image's own tools, which apt never writes.
    - name: Install the packages
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: libsdl2-dev ffmpeg
      run: |
        dpkg-query -W -f '${binary:Package} ${Version}\n' | sort > "$RUNNER_TEMP/apt-before.txt"
        touch "$RUNNER_TEMP/apt-start"
        sudo apt-get update -q
        # shellcheck disable=SC2086
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $PACKAGES
        dpkg-query -W -f '${binary:Package} ${Version}\n' | sort > "$RUNNER_TEMP/apt-after.txt"
        comm -13 "$RUNNER_TEMP/apt-before.txt" "$RUNNER_TEMP/apt-after.txt" | cut -d' ' -f1 > "$RUNNER_TEMP/apt-changed.txt"
        echo "$(wc -l < "$RUNNER_TEMP/apt-changed.txt") packages added or changed."
        mkdir -p "$APT_CACHE_DIR"
        {
          xargs dpkg -L < "$RUNNER_TEMP/apt-changed.txt"
          sudo find /etc /usr /var/lib/dpkg/alternatives -xdev -path /usr/local -prune \
            -o -cnewer "$RUNNER_TEMP/apt-start" \( -type f -o -type l \) -print
        } | grep -v '^/etc/ld.so.cache$' | sort -u |
          while read -r path; do
            if [ -f "$path" ] || [ -L "$path" ]; then echo "${path#/}"; fi
          done > "$RUNNER_TEMP/apt-files.txt"
        sudo tar -cf "$APT_CACHE_DIR/files.tar" -C / -T "$RUNNER_TEMP/apt-files.txt"
        ls -l "$APT_CACHE_DIR/files.tar"
    # Every job installs on a miss; the first one to finish saves.
    - name: Save the installed files
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.APT_CACHE_DIR }}
        key: ${{ env.APT_CACHE_KEY }}
    # A restore runs no package scripts, so the libc-bin trigger that
    # updates the linker cache doesn't run either. The checks fail here,
    # not deep in a build, when a file is missing.
    - name: Check the packages
      shell: bash
      run: |
        sudo ldconfig
        echo "SDL2 $(sdl2-config --version), pkg-config sdl2 $(pkg-config --modversion sdl2)"
        ffmpeg -hide_banner -version | head -1
