name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its old run. Runs on main queue up,
# so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every Python tool comes from uv.lock: each job syncs the dependency
# groups it needs (pyproject.toml) and runs them with uv run --no-sync.
jobs:
  host-python:
    name: Host tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # "pinned" is .python-version. 3.12 is the floor: the components'
        # Python runs inside the user's ESPHome, which supports 3.12.
        python: [pinned, "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Pick the Python
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          if [ "$PYTHON" != pinned ]; then echo "UV_PYTHON=$PYTHON" >> "$GITHUB_ENV"; fi
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # 2 workers: on these 4-CPU runners, 2, 4 and 6 workers all take
      # about 95 s (the daruma persona tests set the pace), against 177 s
      # in one process. 2 was a little ahead in every round.
      - name: Run the host tests
        run: uv run --no-sync pytest tests -n 2

  host-cpp:
    name: Host tests (C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the C++ tests
        run: tests/run_cpp.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install the lint tools
        run: uv sync --locked --only-group lint --no-install-project
      - name: Restore the pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
      # The hooks and their versions come from .pre-commit-config.yaml, so
      # CI and a contributor's machine run the same tools.
      - name: Complexity (complexipy, lizard)
        run: |
          uv run --no-sync pre-commit run complexipy --all-files
          uv run --no-sync pre-commit run lizard --all-files
      - name: Python lint (ruff check)
        run: uv run --no-sync pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Python format (ruff format)
        run: uv run --no-sync pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: C++ format (clang-format)
        run: uv run --no-sync pre-commit run clang-format --all-files --show-diff-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      # The host tests and the component headers they include. The
      # components' .cpp files need ESPHome's headers, so they aren't here.
      - name: Write the compile database
        run: tests/compile_db.sh
      - name: Install clang-tidy
        run: uv sync --locked --only-group tidy --no-install-project
      - name: Run clang-tidy
        run: uv run --no-sync clang-tidy -p build/clang-tidy --quiet tests/test_*.cpp

  config:
    name: Config (${{ matrix.example }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [box3, variant_apps, variant_mono, variant_square, variant_wide, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install ESPHome
        run: |
          uv sync --locked --only-group esphome --no-install-project
          echo "ESPHOME_VERSION=$(uv run --no-sync esphome version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Install SDL2
        if: matrix.example == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
      # The persona art the compile job saves (see there).
      - name: Restore the persona art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      - name: Prepare the build
        run: .github/scripts/prepare-build.sh
      # The examples fetch Daruma with git. Point them at this checkout.
      - name: Check the config
        working-directory: examples
        run: |
          uv run --no-sync esphome \
            -s daruma_url "file://$GITHUB_WORKSPACE" -s daruma_ref ci-head \
            config ${{ matrix.example }}.yaml > "$RUNNER_TEMP/config.log" 2>&1 \
            || { tail -n 60 "$RUNNER_TEMP/config.log"; exit 1; }

  compile:
    name: Compile (box3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # ESPHome compiles through ccache when ccache is on the PATH.
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install ESPHome
        run: |
          uv sync --locked --only-group esphome --no-install-project
          echo "ESPHOME_VERSION=$(uv run --no-sync esphome version | awk '{print $2}')" >> "$GITHUB_ENV"
      # A static ccache from its release, checked against a fixed hash.
      - name: Install ccache
        env:
          VERSION: 4.14.2
          SHA256: b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb
        run: |
          name="ccache-$VERSION-linux-x86_64-musl-static"
          curl -fsSL -o "$RUNNER_TEMP/ccache.tar.xz" \
            "https://github.com/ccache/ccache/releases/download/v$VERSION/$name.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          mv "$RUNNER_TEMP/$name/ccache" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The compiled objects, by the hash of what went in. Every run saves
      # them, pull requests too, so the next push to a pull request starts
      # warm. A pull request's first run starts from main's.
      - name: Restore the ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-box3-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-box3-${{ env.ESPHOME_VERSION }}-
      # Pull requests read the ESP-IDF and build caches that main saves;
      # only main writes the build cache. A pull request saves the ESP-IDF
      # cache only when main has none for this ESPHome version yet.
      - name: Restore the ESP-IDF cache
        id: idf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esp-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      # The build folder and ESPHome's record of the last build (storage).
      # Without that record ESPHome cleans the build folder, and nothing
      # is reused. Not .esphome/packages: it holds ESPHome's git clones,
      # and a restored clone would build old code.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/.esphome/build
            examples/.esphome/storage
          key: esphome-build-box3-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: esphome-build-box3-${{ env.ESPHOME_VERSION }}-
      # Drawing the persona art takes most of the config check. This job
      # saves it for the config jobs, also on pull requests: the key names
      # the exact scripts, and the folder is a few MB.
      - name: Restore the persona art
        id: art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      - name: Prepare the build
        run: .github/scripts/prepare-build.sh
      - name: Compile
        working-directory: examples
        run: |
          set -o pipefail
          ccache --zero-stats
          uv run --no-sync esphome \
            -s daruma_url "file://$GITHUB_WORKSPACE" -s daruma_ref ci-head \
            compile box3.yaml 2>&1 | tee "$RUNNER_TEMP/compile.log"
      - name: Save the ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-box3-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the persona art
        if: steps.art.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/.esphome/daruma_pixel_art
          key: ${{ steps.art.outputs.cache-primary-key }}
      - name: Report the flash size
        run: |
          {
            echo "### Firmware: examples/box3.yaml"
            .github/scripts/flash-size.sh "$RUNNER_TEMP/compile.log"
            echo
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l examples/.esphome/build/daruma/build/firmware.*.bin
      - name: Save the ESP-IDF cache
        if: github.event_name == 'push' || steps.idf.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esp-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      - name: Save the build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/.esphome/build
            examples/.esphome/storage
          key: esphome-build-box3-${{ env.ESPHOME_VERSION }}-${{ github.sha }}

  # The golden pictures match on Linux and macOS (docs/testing.md), so this
  # runs on Linux. The golden check and pytest share one job and one build.
  screens:
    name: Screen tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DARUMA_WORK: ${{ github.workspace }}/ci-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install SDL2 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev ffmpeg
      # The harness syncs ESPHome's own environment (.venv-esphome) itself.
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # The art cache key names the ESPHome version: it pins the Pillow
      # that draws the art. Not the whole uv.lock, which changes more often.
      - name: Read the ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome = \["esphome==\(.*\)"\]$/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
      # Drawing the persona art takes most of a cold desktop build. The build
      # keeps it in .esphome/daruma_pixel_art, one file per persona, named by
      # a hash of the pixel scripts, Pillow and Python. A stale file is
      # never read, so a restored folder can't show old art.
      - name: Restore the persona art
        id: art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      # 4 runs at a time, one per CPU of these runners. A run waits on its
      # device much of the time, so more runs than CPUs is fine too.
      - name: Check the golden pictures
        id: golden
        run: uv run --no-sync python demos/record.py --test --out "$DARUMA_WORK" --jobs 4
      # This job saves the art for the previews. Pull requests save it
      # too: the key names the exact scripts, and the folder is a few MB.
      - name: Save the persona art
        if: ${{ !cancelled() && steps.art.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: ${{ steps.art.outputs.cache-primary-key }}
      # The same build; each device listens on a free port. It runs when
      # the golden check fails too. 4 workers, one per CPU of these runners.
      - name: Run the screen tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$DARUMA_WORK"
          uv run --no-sync pytest demos -n 4 --basetemp="$DARUMA_WORK/pytest"
      - name: Put expected, actual and diff side by side
        if: failure()
        run: >-
          uv run --no-sync python demos/contact_sheet.py diffs
          "$DARUMA_WORK" "$DARUMA_WORK/side-by-side"
      - name: Upload the frames of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: |
            ${{ env.DARUMA_WORK }}
            !${{ env.DARUMA_WORK }}/build/src
          retention-days: 14
          if-no-files-found: ignore

  # Demo GIFs from the desktop build of this commit, so a pull request
  # can be previewed without a device. The standard screen records the
  # full showcase; the others record highlight only, so they share a job.
  previews:
    name: Previews (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            variants: standard
          - name: wide-square
            variants: wide square
    env:
      DARUMA_WORK: ${{ github.workspace }}/ci-work
      VARIANTS: ${{ matrix.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install SDL2 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev ffmpeg
      # The harness syncs ESPHome's own environment (.venv-esphome) itself.
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # The art cache key names the ESPHome version: it pins the Pillow
      # that draws the art. Not the whole uv.lock, which changes more often.
      - name: Read the ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome = \["esphome==\(.*\)"\]$/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
      # The persona art the screen tests save (see there).
      - name: Restore the persona art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      - name: Record the GIFs
        run: |
          for variant in $VARIANTS; do
            want="highlight"
            if [ "$variant" = standard ]; then want="highlight work emotions activities"; fi
            have=""
            for s in $want; do
              if [ -f "demos/scenarios/$s.yaml" ]; then have="${have:+$have,}$s"; fi
            done
            echo "$variant: $have" >> "$RUNNER_TEMP/scenarios.txt"
            uv run --no-sync python demos/record.py --variant "$variant" --scenario "$have" \
              --out "$DARUMA_WORK" --docs "$DARUMA_WORK/preview/gifs" --jobs 4
          done
      - name: Make the contact sheets
        run: >-
          uv run --no-sync python demos/contact_sheet.py gifs
          "$DARUMA_WORK/preview/gifs" "$DARUMA_WORK/preview/sheets"
      - name: Upload the previews
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ matrix.name }}
          path: ${{ env.DARUMA_WORK }}/preview
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
      - name: Describe the previews
        env:
          NAME: ${{ matrix.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          dir="$DARUMA_WORK/preview"
          {
            echo "### Previews: $NAME"
            echo "[preview-$NAME]($URL): $(du -sh "$dir" | cut -f1)."
            sed 's/^/- /; s/,/, /g' "$RUNNER_TEMP/scenarios.txt"
            echo "$(find "$dir/gifs" -name '*.gif' | wc -l | tr -d ' ') GIFs, one contact sheet per scenario."
          } >> "$GITHUB_STEP_SUMMARY"

  preview-comment:
    name: Preview comment
    needs: previews
    # A pull request from a fork gets a read-only token, so no comment.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: previews
          message: |
            **Previews** for ${{ github.event.pull_request.head.sha }}: demo GIFs and contact sheets from the desktop build, in the [run's artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) (`preview-standard`, `preview-wide-square`). Failed screen tests add `screens`, with expected, actual and diff side by side.

            They come from the desktop build of the same packages, so they match the device's screens. They are not recorded on the ESP32.
