name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its old run. Runs on main queue up,
# so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every Python tool comes from uv.lock: each job syncs the dependency
# groups it needs (pyproject.toml) and runs them with uv run --no-sync.
jobs:
  # The C++ host tests take seconds, so they run in the pinned job.
  host:
    name: Host tests (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # "pinned" is .python-version. 3.12 is the floor: the components'
        # Python runs inside the user's ESPHome, which supports 3.12.
        python: [pinned, "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Pick the Python
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          if [ "$PYTHON" != pinned ]; then echo "UV_PYTHON=$PYTHON" >> "$GITHUB_ENV"; fi
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # 2 workers: on these 4-CPU runners, 2, 4 and 6 workers all take
      # about 95 s (the daruma persona tests set the pace), against 177 s
      # in one process. 2 was a little ahead in every round.
      - name: Run the host tests
        run: uv run --no-sync pytest tests -n 2

  # Mutation tests of the lines a pull request changes (docs/testing.md).
  # It fails on a mutant no test catches, but it is not a required check:
  # a person decides whether to add a test or mark the line.
  mutation:
    name: Mutation tests (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # The whole history, for the merge base with the pull request's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install the test tools and mutmut
        run: uv sync --locked --only-group test --only-group mutation --no-install-project
      - name: Run the mutation tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make mutate-diff BASE="$BASE" UV_RUN="uv run --no-sync"

  # Every check runs, even after one fails, so one run shows them all.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # The whole history, for the commit messages of a pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install the lint tools and clang-tidy
        run: uv sync --locked --only-group lint --only-group tidy --no-install-project
      - name: Restore the pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
      # Release notes and versions come from commit messages, so every
      # commit in a pull request must be a Conventional Commit. Only this
      # pull request's commits: older history on main predates the rule.
      - name: Commit messages (gitlint)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-sync gitlint --commits "$BASE..$HEAD"
      # The hooks and their versions come from .pre-commit-config.yaml, so
      # CI and a contributor's machine run the same tools.
      - name: Complexity (complexipy, lizard)
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync pre-commit run complexipy --all-files
          uv run --no-sync pre-commit run lizard --all-files
      - name: Python lint (ruff check)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Python format (ruff format)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: C++ format (clang-format)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pre-commit run clang-format --all-files --show-diff-on-failure
      # The host tests and the component headers they include. The
      # components' .cpp files need ESPHome's headers, so they aren't here.
      - name: C++ lint (clang-tidy)
        if: ${{ !cancelled() }}
        run: |
          tests/compile_db.sh
          uv run --no-sync clang-tidy -p build/clang-tidy --quiet tests/test_*.cpp

  # The config of every example, then the box3 firmware. The compile runs
  # when a config fails too, so one run shows both.
  esphome:
    name: ESPHome
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # ESPHome compiles through ccache when ccache is on the PATH.
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install ESPHome
        run: |
          uv sync --locked --only-group esphome --no-install-project
          echo "ESPHOME_VERSION=$(uv run --no-sync esphome version | awk '{print $2}')" >> "$GITHUB_ENV"
      # For the config of the desktop example.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
      # A static ccache from its release, checked against a fixed hash.
      - name: Install ccache
        env:
          VERSION: 4.14.2
          SHA256: b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb
        run: |
          name="ccache-$VERSION-linux-x86_64-musl-static"
          curl -fsSL -o "$RUNNER_TEMP/ccache.tar.xz" \
            "https://github.com/ccache/ccache/releases/download/v$VERSION/$name.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          mv "$RUNNER_TEMP/$name/ccache" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The compiled objects, by the hash of what went in. Every run saves
      # them, pull requests too, so the next push to a pull request starts
      # warm. A pull request's first run starts from main's.
      #
      # The key has the run id because a saved cache can't be overwritten:
      # a fixed key (per pull request, say) would keep the first run's
      # ccache forever. The exact key never matches on restore. The
      # restore-keys prefix then picks the newest saved ccache: the pull
      # request's own first, else its base branch's or main's. Old entries
      # age out of the repository's 10 GB cache by least recent use.
      - name: Restore the ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-box3-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-box3-${{ env.ESPHOME_VERSION }}-
      # Pull requests read the ESP-IDF and build caches that main saves;
      # only main writes the build cache. A pull request saves the ESP-IDF
      # cache only when main has none for this ESPHome version yet.
      - name: Restore the ESP-IDF cache
        id: idf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esp-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      # The build folder and ESPHome's record of the last build (storage).
      # Without that record ESPHome cleans the build folder, and nothing
      # is reused. Not .esphome/packages: it holds ESPHome's git clones,
      # and a restored clone would build old code.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/.esphome/build
            examples/.esphome/storage
          key: esphome-build-box3-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: esphome-build-box3-${{ env.ESPHOME_VERSION }}-
      # Drawing the persona art takes most of a config check. Pull requests
      # save it too: the key names the exact scripts, and the folder is a
      # few MB.
      - name: Restore the persona art
        id: art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      # The public CI secrets. Their API key is fixed: ESPHome compiles it
      # into main.cpp, so the compiler cache can reuse that file. The
      # ci-head branch names this commit, for the examples' git package.
      - name: Prepare the build
        run: |
          cp examples/secrets.ci.yaml examples/secrets.yaml
          git branch -f ci-head HEAD
      # Every example, one after another; the failed ones are listed at
      # the end. The examples fetch Daruma with git: make points them at
      # this checkout.
      - name: Check the configs
        run: make config
      - name: Compile
        if: ${{ !cancelled() }}
        working-directory: examples
        run: |
          set -o pipefail
          ccache --zero-stats
          uv run --no-sync esphome \
            -s daruma_url "file://$GITHUB_WORKSPACE" -s daruma_ref ci-head \
            compile box3.yaml 2>&1 | tee "$RUNNER_TEMP/compile.log"
      # A new key every run, so this run's objects are kept (see the restore).
      - name: Save the ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-box3-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the persona art
        if: steps.art.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/.esphome/daruma_pixel_art
          key: ${{ steps.art.outputs.cache-primary-key }}
      - name: Report the flash size
        run: |
          {
            echo "### Firmware: examples/box3.yaml"
            .github/scripts/flash-size.sh "$RUNNER_TEMP/compile.log"
            echo
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l examples/.esphome/build/daruma/build/firmware.*.bin
          ccache --show-stats
      - name: Save the ESP-IDF cache
        if: github.event_name == 'push' || steps.idf.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esp-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      - name: Save the build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/.esphome/build
            examples/.esphome/storage
          key: esphome-build-box3-${{ env.ESPHOME_VERSION }}-${{ github.sha }}

  # The golden pictures match on Linux and macOS (docs/testing.md), so this
  # runs on Linux. The scenario files (the golden check) and the Python
  # screen tests run in two jobs side by side, each with its own build: in
  # one job they ran longer than any other job. "Screen tests" below waits
  # for both.
  screens:
    name: Screen tests (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: golden pictures
            id: golden
          - name: pytest
            id: pytest
    env:
      DARUMA_WORK: ${{ github.workspace }}/ci-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install SDL2 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev ffmpeg
      # The test tools include ESPHome, which the harness builds with.
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # The art cache key names the ESPHome version: it pins the Pillow
      # that draws the art. Not the whole uv.lock, which changes more often.
      - name: Read the ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome = \["esphome==\(.*\)"\]$/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
      # Drawing the persona art takes most of a cold desktop build. The build
      # keeps it in .esphome/daruma_pixel_art, one file per persona, named by
      # a hash of the pixel scripts, Pillow and Python. A stale file is
      # never read, so a restored folder can't show old art.
      - name: Restore the persona art
        id: art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      # 4 workers, one per CPU of these runners; each device listens on a
      # free port. The golden job runs the scenario files, the other the
      # Python screen tests.
      - name: Run the ${{ matrix.id == 'golden' && 'golden check' || 'screen tests' }}
        env:
          MARKER: ${{ matrix.id == 'golden' && 'scenario' || 'not scenario' }}
        run: |
          mkdir -p "$DARUMA_WORK"
          uv run --no-sync pytest demos -n 4 -m "$MARKER" --basetemp="$DARUMA_WORK/pytest"
      # The golden job saves the art for the previews. Pull requests save it
      # too: the key names the exact scripts, and the folder is a few MB.
      - name: Save the persona art
        if: ${{ !cancelled() && matrix.id == 'golden' && steps.art.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: ${{ steps.art.outputs.cache-primary-key }}
      - name: Put expected, actual and diff side by side
        if: failure()
        run: >-
          uv run --no-sync python demos/contact_sheet.py diffs
          "$DARUMA_WORK" "$DARUMA_WORK/side-by-side"
      - name: Upload the frames of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-${{ matrix.id }}
          path: |
            ${{ env.DARUMA_WORK }}
            !${{ env.DARUMA_WORK }}/build/src
          retention-days: 14
          if-no-files-found: ignore

  # One check for both screen test jobs, so the name "Screen tests" stays
  # the one a pull request needs.
  screens-done:
    name: Screen tests
    needs: [screens]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Both screen test jobs passed
        env:
          RESULT: ${{ needs.screens.result }}
        run: test "$RESULT" = success

  # Coverage: which code the tests run. It has jobs of its own, beside the
  # test jobs, so no test job gets slower. The coverage jobs build the C++
  # with gcc's --coverage and run the Python under coverage.py; "Coverage
  # report" joins their data. On a pull request it checks two rules
  # (tests/coverage_comment.py) and fails when one breaks.
  coverage-host:
    name: Coverage (host tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      COVERAGE_DIR: ${{ github.workspace }}/ci-coverage
    steps:
      # The pull request's own commit, not the merge with main: the
      # coverage comment maps the line numbers onto the pull request's diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install the test and coverage tools
        run: uv sync --locked --only-group test --only-group coverage --no-install-project
      # CXXFLAGS and DARUMA_CPP_OUT reach tests/conftest.py and test_frames.py,
      # which build the C++ programs.
      - name: Run the host tests
        env:
          CXXFLAGS: --coverage
          DARUMA_CPP_OUT: ${{ env.COVERAGE_DIR }}/cpp
          COVERAGE_FILE: ${{ env.COVERAGE_DIR }}/python/.coverage.host
        run: uv run --no-sync pytest tests -n 2 --cov=src/esphome/components --cov=pixel --cov-report=
      - name: Read the C++ coverage
        run: >-
          uv run --no-sync python tests/coverage_report.py
          --gcov "$COVERAGE_DIR/cpp" --save "$COVERAGE_DIR/cpp-host.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-host
          path: |
            ${{ env.COVERAGE_DIR }}/cpp-host.json
            ${{ env.COVERAGE_DIR }}/python
          include-hidden-files: true
          retention-days: 7

  # The desktop build with coverage (DARUMA_COVERAGE, demos/harness.py),
  # under the golden check and under the screen tests. One job each: in
  # one job they would run longer than the screen test job.
  coverage-screens:
    name: Coverage (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: golden pictures
            id: golden
          - name: screen tests
            id: screens
    env:
      COVERAGE_DIR: ${{ github.workspace }}/ci-coverage
      DARUMA_COVERAGE: ${{ github.workspace }}/ci-coverage/python
      DARUMA_WORK: ${{ github.workspace }}/ci-work
    steps:
      # The pull request's own commit, not the merge with main: the
      # coverage comment maps the line numbers onto the pull request's diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      # No ffmpeg: it only makes GIFs, which coverage doesn't need.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Install the test and coverage tools
        run: uv sync --locked --only-group test --only-group coverage --no-install-project
      - name: Read the ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome = \["esphome==\(.*\)"\]$/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
      # The persona art the screen tests save. With it, the build skips
      # drawing the art; the host tests cover that Python.
      - name: Restore the persona art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      # The scenario files (golden pictures) or the Python screen tests.
      - name: Run the tests
        env:
          MARKER: ${{ matrix.id == 'golden' && 'scenario' || 'not scenario' }}
        run: |
          mkdir -p "$DARUMA_WORK"
          uv run --no-sync pytest demos -n 4 -m "$MARKER" --basetemp="$DARUMA_WORK/pytest"
      - name: Read the C++ coverage
        if: ${{ !cancelled() }}
        env:
          ID: ${{ matrix.id }}
        run: >-
          uv run --no-sync python tests/coverage_report.py
          --gcov "$DARUMA_WORK/build/src/examples/.esphome/build" --save "$COVERAGE_DIR/cpp-$ID.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.id }}
          path: |
            ${{ env.COVERAGE_DIR }}/cpp-${{ matrix.id }}.json
            ${{ env.COVERAGE_DIR }}/python
          include-hidden-files: true
          retention-days: 7

  coverage-report:
    name: Coverage report
    permissions:
      contents: read
      actions: read
      pull-requests: write
    needs: [coverage-host, coverage-screens]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      COVERAGE_DIR: ${{ github.workspace }}/ci-coverage
    steps:
      # The pull request's own commit, so line numbers match its diff. The
      # whole history, for that diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install the coverage tools
        run: uv sync --locked --only-group coverage --no-install-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: ${{ env.COVERAGE_DIR }}/jobs
      # coverage.py maps the build's copy of the sources back onto this
      # checkout ([tool.coverage.paths] in pyproject.toml). The host tests'
      # data on its own gives the "tested" Python number; every job's data
      # also counts the code that runs in the builds. The first combine
      # keeps its input, which the second one reads. Its data file is named
      # .coverage, in a folder of its own: combine only reads files named
      # like the data file. When the host tests failed, there is no host
      # data and no tested number.
      - name: Join the Python coverage
        run: |
          if [ -d "$COVERAGE_DIR/jobs/coverage-host/python" ]; then
            mkdir -p "$COVERAGE_DIR/tested"
            uv run --no-sync coverage combine --keep --data-file="$COVERAGE_DIR/tested/.coverage" \
              "$COVERAGE_DIR"/jobs/coverage-host/python
            uv run --no-sync coverage json --data-file="$COVERAGE_DIR/tested/.coverage" \
              -o "$COVERAGE_DIR/python-tested.json"
          fi
          uv run --no-sync coverage combine --data-file="$COVERAGE_DIR/.coverage" "$COVERAGE_DIR"/jobs/*/python
          uv run --no-sync coverage json --data-file="$COVERAGE_DIR/.coverage" -o "$COVERAGE_DIR/python.json"
      - name: Write the report
        run: |
          uv run --no-sync python tests/coverage_report.py --lines "$COVERAGE_DIR"/jobs/*/cpp-*.json \
            --python "$COVERAGE_DIR/python.json" --tested-python "$COVERAGE_DIR/python-tested.json" \
            --out "$COVERAGE_DIR/report"
          {
            echo "### Coverage"
            echo "Lines the tests run, by area. C++ from the host tests and the desktop build"
            echo "under the screen tests. Python tested: from the host tests. Python run in builds:"
            echo "also ESPHome's config checks and code generation, which run in every build."
            echo "Per file: files.md in the coverage artifact."
            echo
            cat "$COVERAGE_DIR/report/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ env.COVERAGE_DIR }}/report
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
      # main's newest report, to compare with. Main saves one on every push.
      - name: Fetch main's coverage
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s completed -L 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n coverage -D "$COVERAGE_DIR/main"; then
            echo "BASE_RUN=$run_id" >> "$GITHUB_ENV"
          else
            echo "No coverage from main to compare with."
          fi
      # Checks the rules too. It writes "pass" or "fail" to status.txt and
      # succeeds either way, so the comment goes up before the job fails.
      # The thresholds are in tests/coverage_comment.py. The diff has no
      # pathspec, so git pairs a moved file's old and new paths and counts
      # only the lines that changed; the rules count only measured files.
      - name: Write the comment
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff -U0 --find-renames "$BASE...HEAD" > "$COVERAGE_DIR/pr.diff"
          uv run --no-sync python tests/coverage_comment.py "$COVERAGE_DIR/report/lines.json" \
            --tested "$COVERAGE_DIR/report/tested.json" \
            --base "$COVERAGE_DIR/main/lines.json" --base-tested "$COVERAGE_DIR/main/tested.json" \
            --base-run "${BASE_RUN:-}" --diff "$COVERAGE_DIR/pr.diff" \
            --out "$COVERAGE_DIR/comment.md" --status "$COVERAGE_DIR/status.txt"
      # One comment, updated on every push. A pull request from a fork gets
      # a read-only token, so no comment.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: ${{ env.COVERAGE_DIR }}/comment.md
      - name: Check the coverage rules
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(cat "$COVERAGE_DIR/status.txt")" != pass ]; then
            echo "::error::A coverage rule failed. The coverage comment, or the log of \"Write the comment\", shows which."
            exit 1
          fi

  # Demo GIFs from the desktop build of this commit, so a pull request
  # can be previewed without a device. The standard screen records the
  # full showcase; the wide and square screens record highlight only. Two
  # jobs side by side: in one, the previews ran far longer than any test.
  previews:
    name: Previews (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            variants: standard
          - name: wide-square
            variants: wide square
    env:
      DARUMA_WORK: ${{ github.workspace }}/ci-work
      VARIANTS: ${{ matrix.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install SDL2 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev ffmpeg
      # The test tools include ESPHome, which the harness builds with.
      - name: Install the test tools
        run: uv sync --locked --only-group test --no-install-project
      # The art cache key names the ESPHome version: it pins the Pillow
      # that draws the art. Not the whole uv.lock, which changes more often.
      - name: Read the ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome = \["esphome==\(.*\)"\]$/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
      # The persona art the screen tests save (see there).
      - name: Restore the persona art
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DARUMA_WORK }}/build/src/examples/.esphome/daruma_pixel_art
          key: pixel-art-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ hashFiles('.python-version', 'pixel/**/*.py') }}
      - name: Record the GIFs
        run: |
          for variant in $VARIANTS; do
            want="highlight"
            if [ "$variant" = standard ]; then want="highlight work emotions activities"; fi
            have=""
            for s in $want; do
              if [ -f "demos/scenarios/$s.yaml" ]; then have="${have:+$have,}$s"; fi
            done
            echo "$variant: $have" >> "$RUNNER_TEMP/scenarios.txt"
            echo "::group::$variant"
            uv run --no-sync python demos/record.py --variant "$variant" --scenario "$have" \
              --out "$DARUMA_WORK" --docs "$DARUMA_WORK/preview/gifs" --jobs 4
            echo "::endgroup::"
          done
      - name: Make the contact sheets
        run: >-
          uv run --no-sync python demos/contact_sheet.py gifs
          "$DARUMA_WORK/preview/gifs" "$DARUMA_WORK/preview/sheets"
      - name: Upload the previews
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ matrix.name }}
          path: ${{ env.DARUMA_WORK }}/preview
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
      - name: Describe the previews
        env:
          NAME: ${{ matrix.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          dir="$DARUMA_WORK/preview"
          {
            echo "### Previews: $NAME"
            echo "[preview-$NAME]($URL): $(du -sh "$dir" | cut -f1)."
            sed 's/^/- /; s/,/, /g' "$RUNNER_TEMP/scenarios.txt"
            echo "$(find "$dir/gifs" -name '*.gif' | wc -l | tr -d ' ') GIFs, one contact sheet per scenario."
          } >> "$GITHUB_STEP_SUMMARY"
      # One comment names both jobs' artifacts. A pull request from a fork
      # gets a read-only token, so no comment.
      - name: Comment on the pull request
        if: >-
          matrix.name == 'standard' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: previews
          message: |
            **Previews** for ${{ github.event.pull_request.head.sha }}: demo GIFs and contact sheets from the desktop build, in the [run's artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) (`preview-standard`, `preview-wide-square`). Failed screen tests add `screens-golden` or `screens-pytest`, with expected, actual and diff side by side.

            They come from the desktop build of the same packages, so they match the device's screens. They are not recorded on the ESP32.
