name: Release Please

# On every push to main, release-please updates a release pull request
# from the Conventional Commits since the last release: CHANGELOG.md and
# the version in pyproject.toml. Merging that pull request tags v<version>
# and publishes a GitHub release with the same notes.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN starts no workflows, so
          # the release pull request would get no CI. RELEASE_PLEASE_TOKEN
          # (a fine-grained token or a GitHub App token) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
