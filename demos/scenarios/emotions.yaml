name: emotions
description: >-
  Every mood and every reaction the registry knows, one after another, with
  a caption: idle with blinks, a wink, a pet, the moods, then the reactions.
  Together with activities.yaml it shows every state (see covered_states).
showcase: true
personas: all
setup:
  - set: {Outside temperature: 64}
  - wait: 1
steps:
  - caption: Idle
  - show: neutral
  - wait: 3.5
  - caption: Wink
  - action: {name: wink}
  - wait: 1.5
  - caption: Petted
  - pet: true
  - expect: {state: petted}
  - wait: 2.5
  # Moods: what the persona shows for minutes at a time.
  - caption: Happy
  - show: happy
  - wait: 2.5
  - caption: Loved
  - show: loved
  - wait: 2.5
  - caption: Sad
  - show: sad
  - wait: 2.5
  - caption: Scared
  - show: scared
  - wait: 2
  - caption: Sleepy
  - show: sleepy
  - wait: 3
  - caption: Sleeping
  - show: sleeping
  - wait: 3
  - show: ""
  - wait: 0.5
  # Reactions: one-shot animations over whatever shows.
  - caption: Startled
  - show: startled
  - wait: 2.2
  - caption: Celebrate
  - show: celebrate
  - wait: 3.5
  - caption: Paint
  - show: paint
  - wait: 3
  - caption: A task done
  - show: task_done
  - wait: 2.5
  - caption: All tasks done
  - show: tasks_done
  - wait: 3.5
