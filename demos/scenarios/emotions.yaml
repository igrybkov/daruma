name: emotions
description: >-
  Every mood and every reaction the registry knows, one after another, with
  a caption: idle with blinks, a wink, a pet, the moods, then the reactions.
  Together with activities.yaml it shows every state (see covered_states).
showcase: true
personas: all
test_personas: all
setup:
  - set: {Outside temperature: 64}
  - wait: 1
steps:
  - caption: Idle
    steps:
      - show: neutral
      - wait: 3.5
  - caption: Wink
    steps:
      - action: {name: wink}
      - wait: 1.5
  - caption: Petted
    steps:
      - pet: true
      - expect: {state: petted}
      - wait: 2.5
  # Moods: what the persona shows for minutes at a time.
  - caption: Happy
    steps:
      - show: happy
      - wait: 1.5
      - snapshot: happy
      - wait: 1
  - caption: Loved
    steps:
      - show: loved
      - wait: 2.5
  - caption: Sad
    steps:
      - show: sad
      - wait: 1.5
      - snapshot: sad
      - wait: 1
  - caption: Scared
    steps:
      - show: scared
      - wait: 2
  - caption: Sleepy
    steps:
      - show: sleepy
      - wait: 3
  - caption: Sleeping
    steps:
      - show: sleeping
      - wait: 2
      - snapshot: sleeping
      - wait: 1
      - show: ""
      - wait: 0.5
  # Reactions: one-shot animations over whatever shows.
  - caption: Startled
    steps:
      - show: startled
      - wait: 2.2
  - caption: Celebrate
    steps:
      - show: celebrate
      - wait: 1.5
      - snapshot: celebrate
      - wait: 2
  - caption: Paint
    steps:
      - show: paint
      - wait: 3
  - caption: A task done
    steps:
      - show: task_done
      - wait: 2.5
  - caption: All tasks done
    steps:
      - show: tasks_done
      - wait: 3.5
  # Habitica (habitica.yaml): reactions to the hero's numbers.
  - caption: "Habitica: level up"
    steps:
      - show: level_up
      - wait: 3.5
  - caption: "Habitica: hurt"
    steps:
      - show: hurt
      - wait: 2.5
  - caption: "Habitica: a drop"
    steps:
      - show: drop
      - wait: 3
  # Habits (app_habits.yaml): a habit scored up, and down.
  - caption: "A habit: plus"
    steps:
      - show: habit_up
      - wait: 2
  - caption: "A habit: minus"
    steps:
      - show: habit_down
      - wait: 2
  # Habitica skills (habitica.yaml): a skill cast from the Character app.
  - caption: "Habitica: a skill cast"
    steps:
      - show: cast
      - wait: 3
