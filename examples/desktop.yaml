# Daruma in a window on a computer, for demos and tests. The personas and apps
# of box3.yaml, on the desktop board (packages/board_desktop.yaml) instead
# of the BOX-3. It includes the packages from this checkout, so it shows
# your changes as they are. Nothing here is flashed to a device.
#
#   esphome run examples/desktop.yaml   a window: the mouse is the finger,
#                                       H the red circle, T the top button
#   demos/record.py                     demo GIFs of every persona
#   pytest demos                        screen tests (see docs/testing.md)
#
# Calendar and Tasks ask "Home Assistant" for data through the API. The
# demo runner answers with made-up events and tasks, and plays the
# entities the Controls tiles show.

substitutions:
  name: daruma-desktop
  friendly_name: Daruma Desktop

packages:
  board: !include ../packages/board_desktop.yaml
  core: !include ../packages/core.yaml

  persona_daruma: !include ../packages/persona_daruma.yaml
  persona_pixel_corgi: !include ../packages/persona_pixel_corgi.yaml
  persona_the_boss: !include ../packages/persona_the_boss.yaml
  persona_eyes: !include ../packages/persona_eyes.yaml
  persona_flat_corgi: !include
    file: ../packages/persona_images.yaml
    vars:
      persona_id: flat_corgi
      persona_name: "Flat corgi"
      art: flat_corgi
      # The pixel corgi's "awwwrrrr" when petted.
      sounds:
        pet:
          - { note: C#3, to: F#3, seconds: 0.10, duty: 0.30, attack: 0.02, release: 0 }
          - { note: F#3, to: B2, seconds: 0.32, duty: 0.25, attack: 0, release: 0.08, vibrato: 26 }
      # Say-only: a picture does not animate, so these are lines.
      random_events:
        walk_q:
          say: ["Walk?", "Walkies?", "Is it walk time?"]
          frequency: 8
        snore:
          say: ["Zzz...", "Zzzz... biscuit..."]
          frequency: 9
          when: { moods: [sleeping] }
  persona_jack_russell: !include ../packages/persona_jack_russell.yaml
  persona_tabby_cat: !include ../packages/persona_tabby_cat.yaml

  menu: !include ../packages/menu.yaml
  pomodoro: !include ../packages/pomodoro.yaml
  # Demo sources. The demo runner answers for them; nothing real is read.
  app_tasks: !include
    file: ../packages/app_tasks.yaml
    vars: { source: todo, entity: todo.demo }
  app_calendar: !include
    file: ../packages/app_calendar.yaml
    vars: { calendars: calendar.demo }
  app_weather: !include
    file: ../packages/app_weather.yaml
    vars: { entity: weather.demo }
  app_controls: !include
    file: ../packages/app_controls.yaml
    vars:
      tiles:
        - { entity: light.desk_lamp, label: Desk lamp }
        - { entity: media_player.office, label: Music }
        - { entity: scene.movie_night, label: Movie, icon: "mdi:movie" }
        - { entity: fan.desk, label: Fan }
        - { entity: cover.blinds, label: Blinds, icon: "mdi:blinds" }
        - { entity: sensor.office_co2, label: CO2, icon: "mdi:molecule-co2" }
        - { entity: sensor.office_temperature, label: Office, icon: "mdi:thermometer" }
        - { entity: switch.kettle, label: Kettle, icon: "mdi:coffee-maker" }
  # One room, icons alone.
  app_room: !include
    file: ../packages/app_controls.yaml
    vars:
      app_id: room
      app_name: Room
      icons_only: true
      tiles:
        - { entity: light.ceiling, label: Ceiling, icon: "mdi:ceiling-light" }
        - { entity: light.floor_lamp, label: Floor lamp, icon: "mdi:lamp" }
        - { entity: fan.ceiling, label: Fan }
        - { entity: sensor.office_temperature, label: Temperature }
  app_settings: !include ../packages/app_settings.yaml
  prompts: !include ../packages/prompts.yaml
  quiet: !include ../packages/quiet.yaml

daruma:
  apps: [tasks, calendar, weather, stats, controls, room, settings]
  settings: [sounds, dnd, mute]
  progress:
    pomodoro: 1
  # A tap on the persona opens the default main menu (Tasks, Calendar,
  # More), as on the BOX-3.
  menus:
    quick: [pomodoro.skip, pomodoro.stop, stats, more]
  # As on the BOX-3, but the top button changes the persona: there is no voice
  # assistant here. The red circle's press opens the pomodoro menu
  # (pomodoro's default binding).
  bindings:
    home.hold: { action: pomodoro.stop, when: idle }
    top.double: { action: menu.open, menu: quick }
    top.press: daruma.next_persona
    screen.tap: menu.open
    screen.stroke: daruma.pet
  # No random events: a quirk at a random moment would move the screen
  # tests' pictures. Their own scenarios use the `events` build.
  random_events: false
