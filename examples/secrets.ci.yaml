# Secrets for CI builds only. They are public on purpose.
#
# CI copies this file to examples/secrets.yaml. The API key stays fixed:
# ESPHome compiles it into main.cpp, so a fixed key lets the compiler
# cache reuse that file on every run.
#
# Never flash a build made with these values. The device can't join a
# Wi-Fi network, and anyone can read this key. For your own builds, see
# secrets.example.yaml.
