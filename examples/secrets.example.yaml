# Keys the examples read with !secret. Copy them into the secrets.yaml of
# your ESPHome config folder and fill them in. In this repository,
# `make secrets` writes examples/secrets.yaml from this file, with a
# random API key.

# Your Wi-Fi network's name and password.
wifi_ssid: "your-network"
wifi_password: "your-password"
# The password of the hotspot the device opens when it can't join your
# Wi-Fi. At least 8 characters.
wifi_fallback_password: "a-fallback-password"
# The key that encrypts the device's API: 32 random bytes in base64. Make
# one with `openssl rand -base64 32`. ESPHome rejects this all-zeros
# placeholder, so replace it. ESPHome's docs on the key:
# https://esphome.io/components/api/
daruma_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
