# Keys the examples read with !secret. Copy them into the secrets.yaml of
# your ESPHome config folder and fill them in.
#
# The values below are public examples, for CI and desktop builds only.
# Never flash a build made with them: the device can't join your Wi-Fi,
# and anyone can read this API key. For a real device, use your own
# Wi-Fi keys and a new API key: 32 random bytes in base64, from
# `openssl rand -base64 32`. ESPHome's docs on the key:
# https://esphome.io/components/api/
#
# `make secrets` writes examples/secrets.yaml from this file, with a
# random API key.
wifi_ssid: "your-network"
wifi_password: "your-password"
wifi_fallback_password: "a-fallback-password"
daruma_api_key: "i44J6r46hA7FR/lvxT8kJ5fMxUREAYXvXUiqxzAR2u0="
