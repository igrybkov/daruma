# Build check: two copies each of the Tasks and Calendar apps, and two of
# Controls, each copy with its own app_id, entities and switch. Compile-only. It includes
# box3.yaml, so keep the two in one folder with your secrets.yaml:
#
#   esphome compile variant_apps.yaml

substitutions:
  name: daruma-apps
  friendly_name: Daruma Apps
  # The same source as box3.yaml: its substitutions are not in scope for
  # this file's own package entry.
  daruma_url: https://github.com/igrybkov/daruma
  daruma_ref: main

packages:
  device: !include box3.yaml
  more_apps:
    url: ${daruma_url}
    ref: ${daruma_ref}
    files:
      - path: packages/app_tasks.yaml
        vars: { app_id: tasks_family, app_name: Family, source: todo, entity: todo.family }
      - path: packages/app_calendar.yaml
        vars: { app_id: calendar_work, app_name: Work, calendars: calendar.work }
      - path: packages/app_controls.yaml
        vars:
          tiles:
            - { entity: light.desk, label: Desk }
            - { entity: scene.movie, label: Movie, icon: "mdi:movie" }
            - { entity: media_player.office, label: Music }
            - { entity: sensor.office_co2, label: CO2, icon: "mdi:molecule-co2" }
      - path: packages/app_controls.yaml
        vars:
          app_id: controls_lights
          app_name: Lights
          tiles:
            - { entity: light.kitchen, label: Kitchen, icon: "mdi:ceiling-light" }
            - { entity: switch.porch, label: Porch }
            - { entity: cover.garage, label: Garage, icon: "mdi:garage" }

daruma:
  # Added after the device's list (tasks, calendar, weather, stats).
  apps: [tasks_family, calendar_work, controls, controls_lights]
  # App copies by their app id, another menu, an HA event button, and more
  # than five items (four show, then Next).
  menus:
    family:
      - tasks_family
      - calendar_work
      - quick
      - pomodoro.break
      - { label: Lights, icon: "\U000F0335", event: desk_lights }
      - more
  bindings:
    home.double: { action: menu.open, menu: family }
