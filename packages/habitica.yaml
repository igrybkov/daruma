# Habitica module for Daruma: your hero's stats on the device, reactions
# to them, and the Character app. Needs core.yaml and menu.yaml, and the
# Habitica integration in Home Assistant. See docs/habitica.md.
#
# The stats come from the integration's entities, as HA state
# subscriptions: no polling, no automation. `user` is their prefix, the
# part HA put before `_health` in `sensor.<user>_health`.
#
# The persona reacts to the numbers:
#
#   level_up   reaction  the level goes up            falls back to celebrate
#   hurt       reaction  HP drops by hurt_threshold   falls back to scared
#   fainted    activity  while HP is 0                falls back to sad
#   resting    activity  while you rest in the inn    falls back to sleeping
#   drop       reaction  habitica_event "drop"        falls back to happy
#   cast       reaction  a skill cast from the app    falls back to celebrate
#
# The first numbers after a boot or a reconnect only fill the sheet. The
# same numbers twice play once.
#
# The Character app: HP, XP and MP bars with numbers, the level, the class
# and the gold. Under them, the buttons Buy a health potion, Start my day,
# Revive and Allocate stat points. Each shows only while its HA button is
# available. A tap presses the HA button. The potion asks first: it spends
# 25 gold. The board tile reads "Lv 12 · HP 45".
#
# Skills: with `skills` set to a script made from "Daruma: Habitica
# skills", the sheet gets a Skills button: the class's skills, grey with
# the reason when not ready. A self or party skill asks first ("Ask before
# a cast", a setting); a task skill picks a habit from the Habits app. A
# cast takes its MP off at once, until HA sends the real number.
#
# Home Assistant action (esphome.<name>_habitica_event): kind and message.
#   drop    a reaction, and the message in the bubble ("Found a Wolf egg!")
#   quest   the message in the bubble ("Quest: 3 damage to the boss")
# Both fields are required; send "" for no message.
#
# Needs "Allow the device to perform Home Assistant actions" on in the
# ESPHome integration's options in HA, for the buttons.
#
# Words: the text_* values below are the English defaults of the theme
# words habitica.<name>. Colors: habitica.hp, .xp, .mp and .gold.
#
#   packages:
#     daruma:
#       url: https://github.com/igrybkov/daruma
#       ref: main
#       files:
#         - path: packages/habitica.yaml
#           vars: { user: <user> }

defaults:
  # The Habitica entities' prefix in HA.
  user: habitica_user
  app_name: Character
  color: "925CF3"
  # Habitica's max HP. HA has no sensor for it.
  hp_max: "50"
  # HP lost in one change that plays `hurt`.
  hurt_threshold: "1"
  # How long a drop's or a quest's words stay in the bubble.
  event_seconds: "6"
  text_loading: "Waiting for Habitica…"
  text_offline: "Can't reach Home Assistant"
  text_status: "Lv {level} · HP {hp}"
  text_level: "Lv {level}"
  text_gold: "{gold} gold"
  text_hp: "HP"
  text_xp: "XP"
  text_mp: "MP"
  text_warrior: "Warrior"
  text_rogue: "Rogue"
  text_wizard: "Mage"
  text_healer: "Healer"
  text_in_inn: "In the inn"
  text_potion: "Buy potion"
  text_start_day: "Start my day"
  text_revive: "Revive"
  text_allocate: "Allocate"
  text_potion_confirm: "Buy a health potion for 25 gold?"
  text_buy: "Buy"
  text_cancel: "Cancel"
  # The skills script ("Daruma: Habitica skills"); "" for no Skills.
  skills: ""
  text_skills: "Skills"
  text_mp_cost: "{mp} MP"
  text_cast: "Cast"
  text_cast_confirm: "Cast {name} for {mp} MP?"
  text_cast_done: "{name}!"
  text_cast_failed: "Couldn't cast"
  text_no_skills: "No skills yet"
  text_skills_error: "Can't load the skills"
  text_no_tasks: "No habits to aim at"
  text_effect_mpheal: "MP to your party"
  text_effect_earth: "Party INT up"
  text_effect_frost: "Keeps your streaks"
  text_effect_defensive_stance: "CON up, less damage"
  text_effect_valorous_presence: "Party STR up"
  text_effect_intimidate: "Party CON up"
  text_effect_tools_of_trade: "Party PER up"
  text_effect_stealth: "Dodge missed dailies"
  text_effect_heal: "Heals you"
  text_effect_brightness: "Tasks turn bluer"
  text_effect_protect_aura: "Party CON up"
  text_effect_heal_all: "Heals your party"
  text_effect_fireball: "XP and quest damage"
  text_effect_smash: "A task turns bluer"
  text_effect_pickpocket: "Gold from a task"
  text_effect_backstab: "XP and gold from a task"

external_components:
  - source:
      type: local
      path: ../src/esphome/components
    components: [daruma_habitica]

daruma_habitica:
  id: habitica_app
  hp_max: ${hp_max}
  hurt_threshold: ${hurt_threshold}
  message_seconds: ${event_seconds}
  stats:
    health: sensor.${user}_health
    experience: sensor.${user}_experience
    next_level: sensor.${user}_next_level
    mana: sensor.${user}_mana
    max_mana: sensor.${user}_max_mana
    level: sensor.${user}_level
    class: sensor.${user}_class
    gold: sensor.${user}_gold
    inn: switch.${user}_rest_in_the_inn
  buttons:
    potion: button.${user}_buy_a_health_potion
    start_day: button.${user}_start_my_day
    revive: button.${user}_revive_from_death
    allocate: button.${user}_allocate_all_stat_points

color:
  - id: habitica_color
    hex: "${color}"

switch:
  # Ask before a self or party skill ("Cast Stealth for 45 MP?").
  - platform: template
    id: habitica_ask_cast
    name: Ask before a cast
    icon: "mdi:help-circle-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

api:
  actions:
    - action: habitica_event
      variables:
        kind: string
        message: string
      then:
        - lambda: id(habitica_app).event(kind, message);

daruma:
  modules:
    - name: habitica
      apps:
        - id: character
          name: ${app_name}
      states:
        level_up: { kind: reaction, fallback: celebrate, duration: 3s }
        hurt: { kind: reaction, fallback: scared, duration: 2s }
        drop: { kind: reaction, fallback: happy, duration: 2500ms }
        fainted: { kind: activity, fallback: sad, quiet: true }
        resting: { kind: activity, fallback: sleeping, quiet: true }
        cast: { kind: reaction, fallback: celebrate, duration: 2500ms }
      theme:
        colors:
          hp: "F74E52"
          xp: "FFA623"
          mp: "50B5E9"
          gold: "FFBE5D"
        words:
          loading: "${text_loading}"
          offline: "${text_offline}"
          status: "${text_status}"
          level: "${text_level}"
          gold: "${text_gold}"
          hp: "${text_hp}"
          xp: "${text_xp}"
          mp: "${text_mp}"
          warrior: "${text_warrior}"
          rogue: "${text_rogue}"
          wizard: "${text_wizard}"
          healer: "${text_healer}"
          in_inn: "${text_in_inn}"
          potion: "${text_potion}"
          start_day: "${text_start_day}"
          revive: "${text_revive}"
          allocate: "${text_allocate}"
          potion_confirm: "${text_potion_confirm}"
          buy: "${text_buy}"
          cancel: "${text_cancel}"
          skills: "${text_skills}"
          mp_cost: "${text_mp_cost}"
          cast: "${text_cast}"
          cast_confirm: "${text_cast_confirm}"
          cast_done: "${text_cast_done}"
          cast_failed: "${text_cast_failed}"
          no_skills: "${text_no_skills}"
          skills_error: "${text_skills_error}"
          no_tasks: "${text_no_tasks}"
          effect_mpheal: "${text_effect_mpheal}"
          effect_earth: "${text_effect_earth}"
          effect_frost: "${text_effect_frost}"
          effect_defensive_stance: "${text_effect_defensive_stance}"
          effect_valorous_presence: "${text_effect_valorous_presence}"
          effect_intimidate: "${text_effect_intimidate}"
          effect_tools_of_trade: "${text_effect_tools_of_trade}"
          effect_stealth: "${text_effect_stealth}"
          effect_heal: "${text_effect_heal}"
          effect_brightness: "${text_effect_brightness}"
          effect_protect_aura: "${text_effect_protect_aura}"
          effect_heal_all: "${text_effect_heal_all}"
          effect_fireball: "${text_effect_fireball}"
          effect_smash: "${text_effect_smash}"
          effect_pickpocket: "${text_effect_pickpocket}"
          effect_backstab: "${text_effect_backstab}"
      setup: |-
        auto *h = id(habitica_app);
        h->set_presser([](const std::string &entity) { id(habitica_press).execute(entity); });
        // Skills, through the hub's gate for HA calls with replies (ha_calls.h).
        if (std::string("${skills}").rfind("script.", 0) == 0) {
          h->skills().set_fetcher([](int generation) {
            id(daruma_hub).ha_calls().call("habitica skills", [generation](uint32_t call) {
              id(habitica_skills_fetch).execute(call, generation);
            });
          });
          h->skills().set_caster([](int seq, const std::string &skill, const std::string &task) {
            id(daruma_hub).ha_calls().call("habitica cast", [seq, skill, task](uint32_t call) {
              id(habitica_cast).execute(call, seq, skill, task);
            });
          });
          h->skills().set_ask([]() { return id(habitica_ask_cast).state; });
        }

        Daruma::App app;
        app.id = "character";
        app.name = "${app_name}";
        app.icon = "\U000F0787";  // sword-cross
        app.color = id(habitica_color);
        app.status = [h]() { return h->status(); };
        app.draw = [h](Daruma::AppView &v) { h->draw(v); };
        app.input = [h](Daruma::Input input, int x, int y) { return h->input(input, x, y); };
        app.on_open = [h]() { h->on_open(); };
        app.on_close = [h]() { h->on_close(); };
        // The header says "Skills" while the list is up, or the skill being aimed.
        app.title = [h]() {
          const Daruma::Theme &t = id(daruma_hub).theme();
          if (h->skills().active())
            return h->skills().title();
          auto it = t.apps.find("character");
          return it != t.apps.end() && !it->second.name.empty() ? it->second.name : std::string("${app_name}");
        };
        app.back = [h]() { return h->back(); };
        hub.add_app(app);

script:
  # The class's skills. HA renders the script's reply as lines (habitica.h):
  # C, then a K line per skill. Runs from the hub's gate: `call` goes back
  # to it with the answer.
  - id: habitica_skills_fetch
    mode: queued
    max_runs: 2
    parameters:
      call: int
      generation: int
    then:
      - homeassistant.action:
          action: !lambda return "${skills}";
          data:
            op: list
          capture_response: true
          response_template: |-
            {%- set r = response if response is mapping else {} -%}
            {%- set ns = namespace(out=['C\t' ~ (r.get('class') or '') | string]) -%}
            {%- for k in (r.get('skills') or [])[:20] if k is mapping -%}
            {%- set ns.out = ns.out + [['K', k.get('id') | string, k.get('mp') | int(0), k.get('level') | int(0),
                ((k.get('target') or 'self') | string)[:1], '1' if k.get('ready') is sameas true else '0',
                (k.get('name') or '') | string | replace('\t', ' ') | replace('\n', ' '),
                (k.get('why') or '') | string | replace('\t', ' ') | replace('\n', ' ')] | join('\t')] -%}
            {%- endfor -%}
            {{ ns.out | join('\n') }}
          on_success:
            - lambda: |-
                id(daruma_hub).ha_calls().done(call);
                id(habitica_app).skills().on_list(generation, Daruma::HabiticaApp::reply_text(response));
          on_error:
            - lambda: |-
                id(daruma_hub).ha_calls().done(call);
                id(habitica_app).skills().on_list_error(generation);

  # One cast. The reply as lines: R, then S when it has stats.
  - id: habitica_cast
    mode: queued
    max_runs: 2
    parameters:
      call: int
      seq: int
      skill: string
      task: string
    then:
      - homeassistant.action:
          action: !lambda return "${skills}";
          data:
            op: cast
            id: !lambda return skill;
            task: !lambda return task;
          capture_response: true
          response_template: |-
            {%- set r = response if response is mapping else {} -%}
            {%- set ns = namespace(out=['R\t' ~ ('1' if r.get('ok') is sameas true else '0')]) -%}
            {%- set s = r.get('stats') -%}
            {%- if s is mapping -%}
            {%- set st = namespace(v=['S']) -%}
            {%- for k in ['hp', 'hp_max', 'mp', 'mp_max', 'xp', 'xp_next', 'gold', 'level'] -%}
            {%- set st.v = st.v + [s.get(k) | float(-1) | round(2)] -%}
            {%- endfor -%}
            {%- set ns.out = ns.out + [st.v | join('\t')] -%}
            {%- endif -%}
            {{ ns.out | join('\n') }}
          on_success:
            - lambda: |-
                id(daruma_hub).ha_calls().done(call);
                id(habitica_app).skills().on_cast(seq, Daruma::HabiticaApp::reply_text(response));
          on_error:
            - lambda: |-
                id(daruma_hub).ha_calls().done(call);
                id(habitica_app).skills().on_cast_error(seq, error);

  # A tap on a sheet button: HA's button.press. No reply is wanted, so it
  # skips the hub's gate for HA calls (ha_calls.h).
  - id: habitica_press
    mode: queued
    parameters:
      entity: string
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: !lambda return entity;
