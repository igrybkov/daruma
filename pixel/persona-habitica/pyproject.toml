# A uv workspace member. daruma_personas is a namespace package (PEP 420): each
# member adds its own part, so there is no daruma_personas/__init__.py.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daruma-persona-habitica"
version = "0.0.0"
description = "A Habitica avatar as a persona: the compositor and fixture layers (no Habitica art)"
requires-python = ">=3.12"
dependencies = ["daruma-pixel"]

[tool.hatch.build.targets.wheel]
packages = ["src/daruma_personas"]
