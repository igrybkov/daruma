# The pixel-art library (pixel/daruma_pixel) as a Python package, for
# scripts and previews outside an ESPHome build:
#
#   pip install "git+https://github.com/igrybkov/daruma"
#
# ESPHome builds do not install it: the components load it from the
# checkout they come from.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daruma-pixel"
version = "0.0.0"
description = "Pixel-art rooms, personas and engines for Daruma device personas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/igrybkov/daruma"

# Tools for working on Daruma, locked in uv.lock:
#
#   uv sync                    test, lint and clang-tidy tools (the default "dev" group)
#   uv run pytest              host tests and screen tests
#
# ESPHome has a group of its own: it pins an older aioesphomeapi than the
# screen tests use, so the two never share an environment. The screen test
# harness runs ESPHome from .venv-esphome; CI's ESPHome jobs sync only it:
#
#   uv sync --only-group esphome --no-install-project
[dependency-groups]
test = [
    "aioesphomeapi==46.30.0",
    "pillow>=10",
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
]
lint = [
    "gitlint-core==0.19.1",
    "pre-commit==4.7.0",
]
tidy = ["clang-tidy==23.1.4"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "tidy" },
]
# The one place that names the ESPHome version the builds use.
esphome = ["esphome==2026.10.2"]

[tool.uv]
# Linux and Apple Silicon Macs. aioesphomeapi needs a cryptography that
# no longer ships for Intel Macs.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
conflicts = [[{ group = "esphome" }, { group = "test" }]]

[tool.uv.dependency-groups]
esphome = { requires-python = ">=3.12,<3.15" }

[tool.setuptools.packages.find]
where = ["pixel"]
include = ["daruma_pixel*"]

# Lint and format. The version is pinned in .pre-commit-config.yaml; CI
# runs the same hooks.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "demos"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Cognitive complexity (not cyclomatic) per function. Functions above the
# limit today are listed in complexipy-snapshot.json and may not grow; a
# new function above it fails.
[tool.complexipy]
paths = ["components", "pixel", "demos", "tests", "sounds"]
max-complexity-allowed = 15
