# The workspace root of Daruma. It builds nothing itself. Its members:
#
#   src/                 the ESPHome components, editable only (src/pyproject.toml)
#   pixel/daruma-pixel/  the drawing layer (daruma_pixel)
#   pixel/shapes-*/      shapes: pets, rooms, plants, office (daruma_shapes.*)
#   pixel/persona-*/     one package per persona (daruma_personas.*)
#
# ESPHome builds install none of them: they load the components and the
# pixel packages from the checkout they come from.

# Tools for working on Daruma, locked in uv.lock, all in one .venv:
#
#   uv sync                    ESPHome, test, lint and clang-tidy tools (the default "dev" group)
#   uv run pytest              host tests and screen tests
#
# The test tools include ESPHome: the screen tests build with it. CI's
# config and compile jobs sync only ESPHome:
#
#   uv sync --only-group esphome --no-install-project
[dependency-groups]
test = [
    { include-group = "esphome" },
    { include-group = "pixel" },
    # The screen tests talk to the device with it. ESPHome pins the version.
    "aioesphomeapi",
    "pillow>=10",
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
]
# The pixel packages, installed editable: the drawing layer, the shapes
# and the personas (pixel/*/pyproject.toml).
pixel = [
    "daruma-pixel",
    "daruma-shapes-pets",
    "daruma-shapes-rooms",
    "daruma-shapes-plants",
    "daruma-shapes-office",
    "daruma-persona-corgi",
    "daruma-persona-jack-russell",
    "daruma-persona-tabby-cat",
    "daruma-persona-the-boss",
    "daruma-persona-daruma",
]
# The components by their ESPHome names (esphome.components.daruma), for
# scripts and the REPL. Editable only: src/pyproject.toml.
components = ["daruma-components"]
lint = [
    "gitlint-core==0.19.1",
    "pre-commit==4.7.0",
]
tidy = ["clang-tidy==23.1.4"]
# Coverage of the tests (CI's coverage jobs) for the Python. The C++ comes
# from gcc's gcov (tests/coverage_report.py).
coverage = [
    "coverage>=7.6",
    "pytest-cov>=6",
]
# Mutation testing (make mutate, make mutate-diff): docs/testing.md.
mutation = ["mutmut==3.8.1"]
dev = [
    { include-group = "test" },
    { include-group = "components" },
    { include-group = "lint" },
    { include-group = "tidy" },
    { include-group = "coverage" },
    { include-group = "mutation" },
]
# The one place that names the ESPHome version the builds use.
esphome = ["esphome==2026.10.2"]

[tool.uv]
# Linux, Apple Silicon Macs and Windows. Not Intel Macs: aioesphomeapi
# needs a cryptography that no longer ships for them.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

[tool.uv.dependency-groups]
esphome = { requires-python = ">=3.12,<3.15" }

[tool.uv.workspace]
members = ["src", "pixel/daruma-pixel", "pixel/shapes-*", "pixel/persona-*"]

[tool.uv.sources]
daruma-components = { workspace = true }
daruma-pixel = { workspace = true }
daruma-shapes-pets = { workspace = true }
daruma-shapes-rooms = { workspace = true }
daruma-shapes-plants = { workspace = true }
daruma-shapes-office = { workspace = true }
daruma-persona-corgi = { workspace = true }
daruma-persona-jack-russell = { workspace = true }
daruma-persona-tabby-cat = { workspace = true }
daruma-persona-the-boss = { workspace = true }
daruma-persona-daruma = { workspace = true }

# Lint and format. The version is pinned in .pre-commit-config.yaml; CI
# runs the same hooks.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# src/esphome holds only this repository's components; esphome is ESPHome.
known-third-party = ["esphome"]
known-first-party = ["daruma_pixel", "daruma_shapes", "daruma_personas"]

[tool.pytest.ini_options]
testpaths = ["tests", "demos"]
# The pixel packages come from the "pixel" group (part of "test"). The
# components come in through tests/esphome_components.py.
# pytest-xdist, one worker per CPU: on an M-series Mac (5 performance and
# 6 efficiency cores) that beat 2, 4 and 6 workers for both test sets.
# Pass -n 0 to run in one process.
addopts = "-n auto"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# coverage.py. The desktop build runs the components' Python from a scratch
# copy (demos/harness.py); combine maps it back onto this checkout.
[tool.coverage.paths]
components = ["src/esphome/components/", "*/src/src/esphome/components/"]
pixel = ["pixel/", "*/src/pixel/"]

# Mutation testing of the Python the host tests can load (docs/testing.md).
# The other component files import ESPHome, so no host test reaches them.
[tool.mutmut]
source_paths = [
    "src/esphome/components/daruma/registry.py",
    "src/esphome/components/daruma/sprite_codec.py",
    "src/esphome/components/daruma_sprites/extend.py",
]
# The tests read the persona art and the C++ headers from the checkout.
also_copy = ["src", "pixel", "packages", "art"]
pytest_add_cli_args_test_selection = ["tests"]
# One process: mutmut records which test reaches which function, and an
# xdist worker's records never reach it.
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider"]
# Error messages and build log lines are text for people; tests match a
# few words of them.
do_not_mutate_patterns = ["raise RegistryError\\(", "raise ValueError\\(", "^\\s*log\\.append\\("]

# Cognitive complexity (not cyclomatic) per function. Functions above the
# limit today are listed in complexipy-snapshot.json and may not grow; a
# new function above it fails.
[tool.complexipy]
paths = ["src", "pixel", "demos", "tests", "sounds"]
max-complexity-allowed = 15
