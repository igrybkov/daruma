# The workspace root of Daruma. It builds nothing itself. Its members:
#
#   src/                 the ESPHome components, editable only (src/pyproject.toml)
#   pixel/daruma-pixel/  the drawing layer (daruma_pixel)
#   pixel/shapes-*/      shapes: pets, rooms, plants, office (daruma_shapes.*)
#   pixel/persona-*/     one package per persona (daruma_personas.*)
#
# ESPHome builds install none of them: they load the components and the
# pixel packages from the checkout they come from.

# Tools for working on Daruma, locked in uv.lock, all in one .venv:
#
#   uv sync                    ESPHome, test, lint and clang-tidy tools (the default "dev" group)
#   uv run pytest              host tests and screen tests
#
# The test tools include ESPHome: the screen tests build with it. CI's
# config and compile jobs sync only ESPHome:
#
#   uv sync --only-group esphome --no-install-project

# The version of Daruma as a whole. release-please bumps it, and the
# release tag v<version> names it. The packages under src/ and pixel/
# keep their own versions. The root is a virtual project: uv installs
# its dependency groups but builds nothing from it.
[project]
name = "daruma"
version = "0.1.0"
description = "An ESPHome framework for an animated desk companion"
requires-python = ">=3.12"

[dependency-groups]
test = [
    { include-group = "esphome" },
    { include-group = "pixel" },
    # The screen tests talk to the device with it. ESPHome pins the version.
    "aioesphomeapi",
    "grimp>=3.5",
    "pillow>=10",
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
    # Mutation testing (make mutate, make mutate-diff): docs/testing.md.
    # Its scripts change mutmut's internals, so the version is pinned, and
    # the tests that guard them run wherever the tests do.
    "mutmut==3.8.1",
]
# The pixel packages, installed editable: the drawing layer, the shapes
# and the personas (pixel/*/pyproject.toml).
pixel = [
    "daruma-pixel",
    "daruma-shapes-pets",
    "daruma-shapes-rooms",
    "daruma-shapes-plants",
    "daruma-shapes-office",
    "daruma-persona-corgi",
    "daruma-persona-jack-russell",
    "daruma-persona-tabby-cat",
    "daruma-persona-the-boss",
    "daruma-persona-daruma",
]
# The components by their ESPHome names (esphome.components.daruma), for
# scripts and the REPL. Editable only: src/pyproject.toml.
components = ["daruma-components"]
lint = [
    "gitlint-core==0.19.1",
    "pre-commit==4.7.0",
]
tidy = ["clang-tidy==23.1.4"]
# Coverage of the tests (CI's coverage jobs) for the Python. The C++ comes
# from gcc's gcov (tests/coverage_report.py).
coverage = [
    "coverage>=7.6",
    "pytest-cov>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "components" },
    { include-group = "lint" },
    { include-group = "tidy" },
    { include-group = "coverage" },
]
# The one place that names the ESPHome version the builds use.
esphome = ["esphome==2026.11.1"]

[tool.uv]
# The root has a [project] for its version only. Don't build or install it.
package = false
# Linux, Apple Silicon Macs and Windows. Not Intel Macs: aioesphomeapi
# needs a cryptography that no longer ships for them.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

[tool.uv.dependency-groups]
esphome = { requires-python = ">=3.12,<3.15" }

[tool.uv.workspace]
members = ["src", "pixel/daruma-pixel", "pixel/shapes-*", "pixel/persona-*"]

[tool.uv.sources]
daruma-components = { workspace = true }
daruma-pixel = { workspace = true }
daruma-shapes-pets = { workspace = true }
daruma-shapes-rooms = { workspace = true }
daruma-shapes-plants = { workspace = true }
daruma-shapes-office = { workspace = true }
daruma-persona-corgi = { workspace = true }
daruma-persona-jack-russell = { workspace = true }
daruma-persona-tabby-cat = { workspace = true }
daruma-persona-the-boss = { workspace = true }
daruma-persona-daruma = { workspace = true }

# Lint and format. The version is pinned in .pre-commit-config.yaml; CI
# runs the same hooks.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# src/esphome holds only this repository's components; esphome is ESPHome.
known-third-party = ["esphome"]
known-first-party = ["daruma_pixel", "daruma_shapes", "daruma_personas"]

[tool.pytest.ini_options]
testpaths = ["tests", "demos"]
# The pixel packages come from the "pixel" group (part of "test"). The
# components come in through tests/esphome_components.py.
# pytest-xdist, one worker per CPU: on an M-series Mac (5 performance and
# 6 efficiency cores) that beat 2, 4 and 6 workers for both test sets.
# Pass -n 0 to run in one process. Work stealing: a worker that runs out
# takes tests queued for another, so one slow test can't hold back the
# tests queued behind it.
addopts = "-n auto --dist worksteal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# coverage.py. The desktop build runs the components' Python from a scratch
# copy (demos/harness.py); combine maps it back onto this checkout.
[tool.coverage.paths]
components = ["src/esphome/components/", "*/src/src/esphome/components/"]
pixel = ["pixel/", "*/src/pixel/"]

# Mutation testing of all the Python (docs/testing.md): the components,
# the pixel packages and the demo modules that tests reach without a
# device. tests/mutmut_run.py maps pixel/*/src and demos/ to their import
# names. demos/harness.py, record.py and contact_sheet.py are left out:
# only the screen tests, which build a device, reach them.
[tool.mutmut]
source_paths = [
    "src/esphome/components",
    "pixel",
    "demos/scenario.py",
    "demos/demo_data.py",
    "demos/persona_path.py",
    "demos/media.py",
]
# mutmut runs the tests from a copy in mutants/. The tests read the whole
# checkout (art, headers, docs, the paths the docs name), so the copy takes
# every top-level entry git tracks. mutmut copies tests/ and pyproject.toml
# itself. tests/test_mutate_py.py fails when a new entry is missing here.
also_copy = [
    ".clang-format",
    ".clang-tidy",
    ".git-blame-ignore-revs",
    ".gitattributes",
    ".github",
    ".gitignore",
    ".gitlint",
    ".pre-commit-config.yaml",
    ".python-version",
    ".release-please-manifest.json",
    "AGENTS.md",
    "art",
    "blueprints",
    "CHANGELOG.md",
    "complexipy-snapshot.json",
    "CONTRIBUTING.md",
    "demos",
    "docs",
    "examples",
    "LICENSE",
    "Makefile",
    "packages",
    "pixel",
    "README.md",
    "release-please-config.json",
    "renovate.json",
    "sounds",
    "src",
    "uv.lock",
    "whitelizard.txt",
]
# The host tests, and the demo tests that need no device.
pytest_add_cli_args_test_selection = ["tests", "demos/test_scenario.py", "demos/test_harness.py"]
# One process: mutmut records which test reaches which function, and an
# xdist worker's records never reach it.
# The one demo test that starts a device is left out.
pytest_add_cli_args = [
    "-n",
    "0",
    "-p",
    "no:cacheprovider",
    "--deselect",
    "demos/test_harness.py::test_a_failed_start_stops_the_program",
]
# Each mutant runs in a process forked from a clean server. With "fork" it
# would inherit what the first full test run left behind (drawn pictures,
# built personas), and a mutant in code that state hides would survive.
process_isolation = "forkserver"
# A mutant that loops forever runs until its timeout: (the time its tests
# took + timeout_constant) x timeout_multiplier, in seconds. mutmut's x15
# held each looping mutant for minutes. x4 still gives a slow runner room.
timeout_multiplier = 4.0
timeout_constant = 2.0
# The fork server imports only outside modules before it forks a mutant, so
# code that runs at import (a persona's tables) runs again with the mutant.
forkserver_warmup = "import"
preload_modules_file = "tests/mutmut_preload.txt"
# Lines no test can tell a change on apart (docs/testing.md):
# - error messages and build log lines are text for people; tests match a
#   few words of them;
# - a `mode="full"` default is the same as any mode but gray4 and mono;
# - a new picture filled with zeros: no fill, or None, is the same fill.
do_not_mutate_patterns = [
    "raise RegistryError\\(",
    "raise ValueError\\(",
    "^\\s*log\\.append\\(",
    "^def \\w+\\(.*mode: str = \"full\"",
    "Image\\.new\\(.*, (0|\\(0, 0, 0, 0\\))\\)",
]

# Cognitive complexity (not cyclomatic) per function. Functions above the
# limit today are listed in complexipy-snapshot.json and may not grow; a
# new function above it fails.
[tool.complexipy]
paths = ["src", "pixel", "demos", "tests", "sounds"]
max-complexity-allowed = 15
